# ==============================================================================
# Antigravity CLI Custom Statusline Configuration
# ==============================================================================

# 語言設定 (Language): "zh-tw" (繁體中文) 或 "en" (English)
LANGUAGE="zh-tw"

# 視覺風格設定
# SHOW_BOX_BORDER: 是否顯示盒型樹狀線 (╭─, ├─, ╰─)
SHOW_BOX_BORDER=true

# PROGRESS_BAR_STYLE: 進度條樣式 ("block": [██░░] 或 "ascii": [##--])
PROGRESS_BAR_STYLE="block"

# ------------------------------------------------------------------------------
# 第一行（核心會話項目）
# 可用項目: "state" "git" "model" "project" "conv_id"
# ------------------------------------------------------------------------------
LINE1_ITEMS=(
  "state"         # Agent 運行狀態 ([就緒] / [思考中] / [處理中] / [工具執行])
  "git"           # Git 分支名稱與變更狀態 (*有變更)
  "model"         # 當前使用中的 AI 模型名稱
  "project"       # 當前專案/工作區目錄
  # "conv_id"     # 對話 ID 前 8 碼 (預設關閉，若需要可取消註解)
)

# ------------------------------------------------------------------------------
# 第二行起（動態膠囊指標項目，依序自適應折行）
# 可用項目:
#   "context"      - 脈絡視窗消耗進度與 Token 量
#   "quota_5h"     - 5小時 API 配額進度條與重置倒數
#   "quota_weekly" - 每週 API 配額進度條與重置倒數
#   "ram"          - 系統記憶體使用率 (從 /proc/meminfo 即時讀取)
#   "cpu"          - 即時 CPU 使用率 (從 /proc/stat 即時計算)
#   "artifacts"    - 對話產出的檔案數量 (大於 0 時顯示)
#   "subagents"    - 活躍子代理數量 (大於 0 時自動顯示)
#   "bg_tasks"     - 背景任務數量 (大於 0 時自動顯示)
# ------------------------------------------------------------------------------
BADGE_ITEMS=(
  "context"
  "quota_5h"
  "quota_weekly"
  "ram"
  "cpu"
  "artifacts"
  "subagents"
  "bg_tasks"
)

# ------------------------------------------------------------------------------
# 警戒值與長度截斷設定
# ------------------------------------------------------------------------------
SYS_RAM_WARN_PCT=80          # RAM 警戒百分比 (超過則顏色轉黃/紅)
SYS_LOAD_WARN=8.0            # CPU 負載警戒值
GIT_MAX_BRANCH_LEN=24        # 分支名稱最大長度，過長自動省略為 ...
PROJECT_MAX_LEN=28           # 專案路徑最大長度
MODEL_MAX_LEN=26             # 模型名稱最大長度
